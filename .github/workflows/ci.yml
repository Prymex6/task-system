name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: PHP
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: tasksystem_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # LandlordTestCase repoints the 'central' connection at a database of its
      # own, because a handful of table names exist in both schemas and would
      # otherwise collide in one.
      - name: Create the landlord test database
        run: mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS tasksystem_central_test"

      # TenantTestCase expects the schema to already exist: it rolls back per
      # test rather than migrating, so the tables are built once up front.
      #
      # Both sets go in here. Tenant screens read landlord tables through the
      # 'central' connection — the billing screen lists the subscription plans —
      # and outside LandlordTestCase that connection resolves to this database.
      - name: Migrate the tenant test database
        run: |
          php artisan migrate --path=database/migrations/tenant --force
          php artisan migrate --path=database/migrations/landlord --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tasksystem_test
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Migrate the landlord test database
        run: php artisan migrate --path=database/migrations/landlord --database=central --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tasksystem_central_test
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tasksystem_test
          DB_USERNAME: root
          DB_PASSWORD: ''

  frontend:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check "resources/js/**/*.{js,vue}"

      - name: Build
        run: npm run build
